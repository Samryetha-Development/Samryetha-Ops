name: Build update-service

# update-service 是 Go 单静态二进制（零第三方依赖）。
# 在这里交叉编译出 linux/amd64 产物并作为 Release 附件发布，
# 这样生产服务器无需安装 Go —— ops_self_update.sh 直接下载即可。
#
# 发布流程（自动打 tag，不再手工选版本号）：
#   1. push main → 构建 + 冒烟测试（必须全绿）
#   2. 冒烟通过后，由 release job 依据提交信息自动决定版本号并打 tag
#   3. tag 触发的同一次运行里上传 Release 附件
#
# 版本号规则（读最新 vX.Y.Z tag，按提交信息决定）：
#   [major]  → X+1.0.0
#   [minor]  → X.Y+1.0
#   其它     → X.Y.Z+1
#   [skip release] → 不发布
#
# 这样服务器始终拉 releases/latest 即可，版本序列连续且可追溯。

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "update-service/**"
      - ".github/workflows/build-update-service.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # 只在提交信息首行匹配，避免描述里提到标记时被误判
  # （曾因提交信息里解释规则本身包含 "[skip release]" 而漏发版本）
  SKIP_TOKEN: "!release-skip"

jobs:
  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: update-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: update-service/go.sum

      - name: Verify (gofmt + vet)
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt 有未格式化文件:"; gofmt -l .; exit 1; }
          go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/update-service .
          file dist/update-service
          sha256sum dist/update-service > dist/update-service.sha256

      - name: Smoke test (starts and serves /healthz)
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/status"
          head -c 48 /dev/urandom | base64 | tr -d '\n' > "$tmp/status/.service-secret"
          SAMRYETHA_ROOT="$tmp" LISTEN=127.0.0.1:3030 OIDC_ISSUER=https://example.invalid \
            ./dist/update-service & pid=$!
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null http://127.0.0.1:3030/healthz && break || sleep 0.5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3030/healthz || true)
          kill "$pid" 2>/dev/null || true
          [ "$code" = "200" ] || { echo "healthz 未返回 200（got $code）"; exit 1; }
          echo "smoke ok"

      - uses: actions/upload-artifact@v4
        with:
          name: update-service-linux-amd64
          path: |
            update-service/dist/update-service
            update-service/dist/update-service.sha256

  # 构建通过后才发布。只在 main 上跑，PR 不发布。
  release:
    name: Tag + Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: update-service-linux-amd64
          path: dist

      - name: Decide version
        id: ver
        run: |
          # 只看首行：正文里解释发布规则不该影响是否发布
          subject="$(git log -1 --pretty=%s)"
          if printf '%s' "$subject" | grep -qF "$SKIP_TOKEN"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "首行含 $SKIP_TOKEN，不发布"
            exit 0
          fi
          latest="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          base="${latest:-v0.0.0}"; base="${base#v}"
          IFS=. read -r MA MI PA <<< "$base"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          if printf '%s' "$subject" | grep -qF '[major]'; then MA=$((MA+1)); MI=0; PA=0
          elif printf '%s' "$subject" | grep -qF '[minor]'; then MI=$((MI+1)); PA=0
          else PA=$((PA+1)); fi
          echo "version=v${MA}.${MI}.${PA}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "首行: $subject"
          echo "上一版 ${latest:-无} → 本次 v${MA}.${MI}.${PA}"

      - name: Tag
        if: steps.ver.outputs.skip == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          git tag "$v"
          git push origin "$v"

      - name: Release
        if: steps.ver.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: |
            dist/update-service
            dist/update-service.sha256
          generate_release_notes: true
