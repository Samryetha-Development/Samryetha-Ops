name: Kernel checks

# 内核项目的核心主张都无法靠"看起来对"来保证：
#   - 内核不知道更新为何物（不变量）
#   - syscall 的实现与权限表一致（契约）
#   - 配置里引用的路径彼此自洽（cfgcheck）
# 这些检查必须在每次推送时自动跑，否则主张就会悄悄腐化。
#
# 触发：任何 push / PR（不只是改动 update-service 时）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Kernel invariants
    runs-on: ubuntu-latest
    env:
      # 硬约束工具链：精确使用 go1.26.10，禁止升级到更高小版本（1.27.x 仍在 CVE-2026-111943 影响范围）。
      # toolchain 行只是"建议"；此值才是精确版本硬约束（与 build-update-service.yml 一致）。
      # Hard-constrain the toolchain: force exactly go1.26.10, no upgrade to a higher patch
      # (1.27.x is still within CVE-2026-111943). The toolchain line is only a suggestion; this
      # value is the exact-version hard constraint (same as build-update-service.yml).
      GOTOOLCHAIN: "go1.26.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { echo "未格式化:"; gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Assert Go toolchain is exactly go1.26.10
        run: |
          # 断言：构建工具链必须精确为 go1.26.10，防止 GOTOOLCHAIN 在别处被绕过后用上未修补版本
          # Assert: the build toolchain must be exactly go1.26.10, guarding against GOTOOLCHAIN bypass
          go version
          go version | grep -qF 'go1.26.10' || { echo "错误：工具链不是 go1.26.10"; exit 1; }

      - name: go test (race)
        # -race 不是可选项：本仓库出过"普通 map 被并发写导致内核崩溃"的事故，
        # 这类缺陷只有竞态检测能稳定抓住。
        run: go test -race -count=1 ./...

      - name: syscall contract
        run: python3 scripts/check-syscall-contract.py

      - name: kernel invariants
        run: python3 scripts/check-kernel-invariant.py

      - name: deploy.yaml self-consistency
        run: go run ./cmd/cfgcheck

      - name: Frontend deployment integrity gate
        run: |
          bash -n scripts/build-forum-frontend.sh
          bash scripts/test-build-forum-frontend.sh

      - name: service-level checks (update-service)
        working-directory: update-service
        run: |
          test -z "$(gofmt -l .)" || { echo "未格式化:"; gofmt -l .; exit 1; }
          go vet ./...
